baseURL: https://pietroargento.com/
locale: en-us
title: Pietro Argento
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: Pietro Argento
  description: Data Scientist focused on AI engineering, AI agents, ML and MLOps.
  author: Pietro Argento

  defaultTheme: dark
  disableThemeToggle: true

  ShowReadingTime: true
  ShowToc: true
  TocOpen: false
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowShareButtons: false
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true

  profileMode:
    enabled: true
    title: Pietro Argento
    subtitle: Data Scientist · AI/ML Engineering
    buttons:
      - name: Posts
        url: /posts/
      - name: Tags
        url: /tags/
      - name: About
        url: /about/

  socialIcons:
    - name: github
      url: https://github.com/p-argento
    - name: linkedin
      url: https://www.linkedin.com/in/pietro-argento/
    - name: strava
      url: https://www.strava.com/athletes/107757242

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
